<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vegan Russian — ссылки</title>
<meta name="description" content="Все проекты и контакты Vegan Russian">
<link rel="icon" href="assets/avatar.png">
<link rel="apple-touch-icon" href="assets/avatar.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Vegan Russian — ссылки">
<meta property="og:description" content="Все проекты и контакты Vegan Russian">
<meta property="og:url" content="https://links.veganrussian.ru/">
<meta property="og:image" content="https://links.veganrussian.ru/assets/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #f4f6f8;
    --link-bg: rgba(175, 222, 233, .86);
    --link-text: #3a0d5c;
    --shadow: #d0bfff;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: #9b13f7; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #f016ba 0%, #9b13f7 100%) fixed;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  .avatar {
    display: block; width: 110px; height: 110px; margin: 0 auto 8px;
    border-radius: 50%;
  }
  h2 {
    margin: 32px 0 14px; text-align: center;
    font-size: 1.35rem; font-weight: 800; text-transform: uppercase;
  }
  .link {
    display: block; margin: 0 0 14px; padding: 14px 22px;
    border-radius: 40px; background: var(--link-bg);
    color: var(--link-text); text-decoration: none; text-align: center;
    box-shadow: 0 0 9px var(--shadow);
    transition: transform .15s ease;
  }
  .link:hover, .link:focus-visible { transform: scale(1.03); }
  .title { display: block; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
  .desc { display: block; margin-top: 2px; font-size: .9rem; font-weight: 500; opacity: .85; }
  .closed .link { opacity: .65; }
  footer { margin-top: 40px; text-align: center; font-size: .8rem; opacity: .7; }
</style>
</head>
<body>
<main>
  <img class="avatar" src="assets/avatar.png" alt="Vegan Russian" width="110" height="110">
{{ links }}
  <footer>© Vegan Russian</footer>
</main>
</body>
</html>
